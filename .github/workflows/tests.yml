name: Tests (Linux)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Pi scripts compile with the oldest supported Python syntax
        run: python -m py_compile src/x500fs/pi_side/x500fs_collector.py src/x500fs/pi_side/x500fs_camera.py
      - name: Shell scripts syntax
        run: for f in pi/deploy/*.sh; do bash -n "$f"; done
      - run: python -m pytest -q
